info:
  name: Competition Matches
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/competitions/{{cid}}/matches?token={{access_token}}&per_page={{per_page}}&paged={{paged}}"
  params:
    - name: token
      value: "{{access_token}}"
      type: query
    - name: per_page
      value: "{{per_page}}"
      type: query
    - name: paged
      value: "{{paged}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
