info:
  name: Competition Standings
  type: http
  seq: 6

http:
  method: GET
  url: "{{base_url}}/competitions/{{cid}}/standings?token={{access_token}}"
  params:
    - name: token
      value: "{{access_token}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
