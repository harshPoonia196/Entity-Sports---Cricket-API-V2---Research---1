info:
  name: Match Squads
  type: http
  seq: 15

http:
  method: GET
  url: "{{sandbox_base_url}}/matches/{{mid}}/squads?token={{access_token}}"
  params:
    - name: token
      value: "{{access_token}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
