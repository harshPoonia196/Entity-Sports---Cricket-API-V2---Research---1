info:
  name: Match Statistics
  type: http
  seq: 16

http:
  method: GET
  url: "{{sandbox_base_url}}/matches/{{mid}}/statistics?token={{access_token}}"
  params:
    - name: token
      value: "{{access_token}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
