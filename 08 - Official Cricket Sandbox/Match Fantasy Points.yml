info:
  name: Match Fantasy Points
  type: http
  seq: 13

http:
  method: GET
  url: "{{sandbox_base_url}}/matches/{{mid}}/point?token={{access_token}}"
  params:
    - name: token
      value: "{{access_token}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
