info:
  name: Player Profile
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/players/{{pid}}?token={{access_token}}"
  params:
    - name: token
      value: "{{access_token}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
