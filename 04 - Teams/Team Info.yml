info:
  name: Team Info
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/teams/{{tid}}?token={{access_token}}"
  params:
    - name: token
      value: "{{access_token}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
