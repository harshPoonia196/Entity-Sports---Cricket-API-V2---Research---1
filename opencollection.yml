opencollection: 1.0.0

info:
  name: Cricket-app
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: base_url
      value: https://restapi.entitysport.com/v2
    - name: sandbox_base_url
      value: https://restapi.entitysport.com/sandbox/cricket
    - name: access_token
      value: ec471071441bb2ac538a0ff901abd249
    - name: access_key
      value: ""
    - name: secret_key
      value: ""
    - name: per_page
      value: "20"
    - name: paged
      value: "1"
    - name: status
      value: ""
    - name: sid
      value: "2022"
    - name: cid
      value: "123126"
    - name: mid
      value: "87002"
    - name: tid
      value: "127857"
    - name: pid
      value: "44114"
    - name: inning_num
      value: "1"
    - name: stats_type
      value: ""
  scripts:
    - type: before-request
      code: if (!bru.getGlobalEnvVar('access_token')) bru.setGlobalEnvVar('access_token', 'ec471071441bb2ac538a0ff901abd249');

docs:
  content: |-
    Research-backed Cricket API V2 collection. Core paths are taken from Entity Sports' official cricket Node SDK and cross-checked against Entity Sports documentation/blog. Development token is preconfigured. Newer Cricket Stats/Prediction/Exchange products are documented by Entity Sports, but their exact REST paths were not publicly retrievable, so they are listed as documentation-only notes rather than guessed requests.

    Also includes the Cricket-app internal API requests (jersey management, auth) at the collection root.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
